plugins { id 'com.android.application' }

android {
    namespace 'com.lastverse.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lastverse.pro'
        minSdk 23
        targetSdk 35
        versionCode 26501
        versionName '2.65.1-native'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
